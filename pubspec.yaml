name: code_shuffle
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  supabase_flutter: ^2.15.4
  haptic_feedback: ^0.6.4+3
  flutter_dotenv: ^6.0.1
  google_mobile_ads: ^6.0.0
  just_audio: ^0.9.40
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/icon_app3.png"
  adaptive_icon_background: "#1A1038"

flutter:
  assets:
    - .env
    - assets/sql_puzzles.json
    - assets/icon_app.png
    - assets/icons/app_icon2.png
    - assets/music/home_song1.mp3
    - assets/music/home_song2.mp3
    - assets/music/chill_mode.mp3
    - assets/music/error_sound.mp3
    - assets/music/placement_sound.mp3
    - assets/music/sucess_sound.mp3
    - assets/music/app_song1.mp3
    - assets/images/
    - assets/daily_chall_puzzles.json
    - assets/survival_puzzles_easy.json
    - assets/survival_puzzles_medium.json
    - assets/survival_puzzles_hard.json
    - assets/survival_puzzles_medium1.json
    - assets/survival_puzzles_hard1.json

  uses-material-design: true